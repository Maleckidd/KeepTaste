# Flow 2 — create a recipe (title + ingredients); the save opens its view, and
# it is then listed under "All recipes".
appId: ${APP_ID}
env:
  # The side-by-side E2E build (.maestro/README.md); override with -e APP_ID=...
  APP_ID: ${APP_ID || "com.damianmalecki.keeptaste.e2e"}
name: Create recipe
tags:
  - recipes
---
- runFlow: subflows/fresh-launch.yaml

- tapOn:
    id: home-add-recipe
- tapOn:
    id: recipe-title
- inputText: "Maestro Lemon Soup"
- tapOn:
    id: recipe-ingredients
- inputText: "2 lemons"
- pressKey: Enter
- inputText: "1 l vegetable stock"
# No hideKeyboard: on Android it sends a system Back, and Back closes the form
# without saving (known bug). Save is pinned above the keyboard anyway.
- tapOn:
    id: recipe-save

# The save replaces the form with the new recipe's view (SPEC.md §5.5, F-010).
# recipe-save exists only on the form, so its absence proves the form is gone
# (the title and ingredient texts below would also match on the form itself).
- extendedWaitUntil:
    notVisible:
      id: recipe-save
    timeout: 10000
- assertVisible: "Maestro Lemon Soup"
- assertVisible: "Ingredients"
- assertVisible: "2 lemons"
- assertVisible: "1 l vegetable stock"

# System Back from the view returns to home (the known Back bug is form-only).
# The new recipe has no cookbook, so it is listed under "All recipes" (newest
# first, above the seeded "Pancakes").
- back
- extendedWaitUntil:
    visible:
      id: home-all-recipes
    timeout: 10000
- tapOn:
    id: home-all-recipes
- assertVisible: "Maestro Lemon Soup"
- assertVisible: "Pancakes"
