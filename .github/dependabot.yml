# Dependabot for a finished Expo app: keep the dependencies patched and the
# Actions pins current, without proposing upgrades that need a migration.
#
# - Expo SDK packages are not Dependabot's to move. expo, expo-*, @expo/*,
#   react, react-dom, react-native and the native libraries Expo pins
#   (gesture-handler, reanimated, safe-area-context, screens, web, worklets)
#   must stay on the versions `npx expo install --check` expects for the SDK,
#   and move together in an SDK upgrade (docs/upgrade-sdk-57.md).
# - sql.js is pinned exactly: db/client.web.ts fetches the matching .wasm
#   by version, and the E2E fixture fails if they drift.
# - Major versions are migrations (Jest 30, TypeScript 7, ESLint 10, …) and
#   are done by hand, if at all.
#
# Security advisories still reach the repository through `npm audit` in CI
# (audit-ci, see SECURITY.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dev-tooling:
        dependency-type: development
      runtime:
        dependency-type: production
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'eslint-config-expo'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: '@react-native/*'
      - dependency-name: 'react-native-gesture-handler'
      - dependency-name: 'react-native-reanimated'
      - dependency-name: 'react-native-safe-area-context'
      - dependency-name: 'react-native-screens'
      - dependency-name: 'react-native-web'
      - dependency-name: 'react-native-worklets'
      - dependency-name: '@types/react'
      - dependency-name: 'sql.js'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
