name: Mutation testing

# StrykerJS over the pure parsers in utils/ (stryker.config.mjs,
# docs/mutation-testing.md). A full run takes well over half an hour, so it is
# not part of CI on every push and is deliberately NOT a required check: it
# runs weekly and on demand, and its report is read, not gated on per PR.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC

# Least privilege: the job only reads the repository. Every action is pinned
# to a full commit SHA (tag in the comment) so a moved or compromised tag
# cannot change what runs here — see SECURITY.md.
permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    name: Stryker (utils/ parsers)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fails only if the score drops below thresholds.break in
      # stryker.config.mjs.
      - name: Mutation testing
        run: npm run test:mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: error
