name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists a PR's commits to scan them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: scan every commit, not just the tip
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Report in the job summary and SARIF artifact; no PR comments, so
          # the token stays read-only. No license needed on a personal account.
          GITLEAKS_ENABLE_COMMENTS: false

  audit:
    name: Dependency audit (audit-ci)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Fails on any advisory of moderate severity or above that is not in the
      # justified allowlist (audit-ci.jsonc, reasons in SECURITY.md). Reads
      # package-lock.json; nothing is installed.
      - name: npm audit gate
        run: npx --yes audit-ci@7.1.0 --config audit-ci.jsonc

  dependency-review:
    name: Dependency review
    # Dependency review needs the dependency graph, which on a private
    # repository requires GitHub Code Security. Skipped until public.
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # New or changed dependencies only; existing advisories are gated
          # by audit-ci above.
          fail-on-severity: moderate
