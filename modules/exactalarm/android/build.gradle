apply plugin: 'com.android.library'

group = 'expo.modules.exactalarm'
version = '0.1.0'

// Wired through the legacy ExpoModulesCorePlugin.gradle helper, mirroring
// modules/safwriter, so the module links into this app's android/ project.
def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()
useExpoPublishing()

android {
  namespace "expo.modules.exactalarm"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// TimerNotificationsService / TimerPresentationDelegate subclass the
// expo-notifications receiver and presentation delegate (ringing timer
// alarms). SDK 57 links expo-notifications prebuilt from its local-maven-repo
// (no ':expo-notifications' Gradle project), so depend on the coordinate it
// publishes, read from its expo-module.config.json; fall back to the project
// when it is built from source.
def expoNotificationsDependency() {
  if (findProject(':expo-notifications') != null) {
    return project(':expo-notifications')
  }
  def configFile = new File(providers.exec {
    workingDir(projectDir)
    commandLine("node", "--print", "require.resolve('expo-notifications/expo-module.config.json')")
  }.standardOutput.asText.get().trim())
  def publication = new groovy.json.JsonSlurper().parse(configFile).android.publication
  return "${publication.groupId}:${publication.artifactId}:${publication.version}"
}

dependencies {
  implementation expoNotificationsDependency()
}
